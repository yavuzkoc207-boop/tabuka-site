<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabuKA</title>
    <style>
        :root {
            --primary: #4F46E5;
            --text: #1F2937;
            --muted: #4B5563;
            --bg: #F9FAFB;
            --card-bg: #FFFFFF;
            --border: #E5E7EB;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background-color: var(--bg);
            margin: 0;
            padding: 24px 16px;
        }
        .container {
            max-width: 780px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
        }
        h1 {
            color: var(--primary);
            font-size: 26px;
            margin-top: 0;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
        }
        h2 {
            font-size: 19px;
            color: var(--primary);
            margin-top: 28px;
        }
        p, li {
            color: var(--muted);
            font-size: 15px;
        }
        ul {
            padding-left: 20px;
        }
        .badge {
            display: inline-block;
            background: #EEF2FF;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .footer {
            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: #9CA3AF;
            text-align: center;
        }
        hr {
            margin: 40px 0;
            border: 0;
            border-top: 1px dashed var(--border);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>TabuKA</h1>
    <p>Arkadaşlarınızla takım halinde oynanan, sesli hakemli tabu ve kelime anlatma oyunu.</p>
    <ul>
        <li><a href="./privacy.html">Gizlilik Politikası / Privacy Policy</a></li>
        <li><a href="./support.html">Destek / Support</a></li>
    </ul>
    <div class="footer">&copy; 2026 TabuKA - Kürşad ARAS</div>
</div>
</body>
</html>
